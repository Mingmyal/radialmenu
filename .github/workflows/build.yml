name: Release Build
on:
  push:
    tags: ["v*"] # 只有推送 v* 标签时才会触发

# 必须加这一行，否则 GitHub 会拒绝创建 Release
permissions:
  contents: write

jobs:
  build:
    name: Build Tagged Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle Packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew build --stacktrace --no-daemon

      - name: Clean Extra Artifacts
        run: |
          rm build/libs/*-sources.jar build/libs/*-dev.jar || true

      # 下面是新增的自动发布步骤
      # 本仓库发布的一律是预览版: 不占用 Latest, 也不顶替正式版的位置。
      # 稳定版在 main 仓库发布 (v2.2.0 起资源同步为稳定功能)。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          name: "v2.2.1 — Jostar / Cobblemon 联动限定版 (预发布)"
          draft: false
          prerelease: true
          make_latest: false